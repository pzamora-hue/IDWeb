<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tareas Universitarias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <div class="card-header bg-primary text-white d-flex align-items-center gap-3">
    <img src="img/logo.png" alt="Logo Gestor de Tareas" width="40" height="40" class="bg-white rounded-circle p-1">
    <h1 class="h3 mb-0">Gestión de Tareas Universitarias</h1>
</div>
</head>
<body class="bg-light">

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h3 mb-0">Gestión de Tareas Universitarias</h1>
                    </div>
                    <div class="card-body">
                        
                        <!-- Div de alertas dinámicas -->
                        <div id="alert-container"></div>

                        <!-- Formulario de alta -->
                        <form id="todo-form" class="mb-4">
                            <div class="row g-2">
                                <div class="col-md-5">
                                    <input type="text" id="titulo-input" class="form-control" placeholder="Título de la tarea">
                                </div>
                                <div class="col-md-4">
                                    <input type="text" id="curso-input" class="form-control" placeholder="Nombre del curso">
                                </div>
                                <div class="col-md-3">
                                    <input type="date" id="fecha-input" class="form-control">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mt-2">Agregar Tarea</button>
                        </form>

                        <!-- Filtros visuales -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h5 mb-0">Lista de Tareas</h2>
                            <div class="btn-group btn-group-sm" id="filter-buttons">
                                <button class="btn btn-outline-primary active" data-filter="todas">Todas</button>
                                <button class="btn btn-outline-primary" data-filter="pendientes">Pendientes</button>
                                <button class="btn btn-outline-primary" data-filter="completadas">Completadas</button>
                            </div>
                        </div>

                        <!-- Lista de tareas dinámicas -->
                        <ul id="todo-list" class="list-group">
                            <!-- Se renderiza desde JS -->
                        </ul>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
